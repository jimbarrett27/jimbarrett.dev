[project]
name = "telegram-bot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-cloud-secret-manager>=2.23.3",
    "python-telegram-bot[job-queue]>=21.0",
    "requests>=2.32.3",
    "sqlalchemy>=2.0.41",
    "alembic>=1.13.0",
    "jinja2>=3.1.0",
    "langgraph>=0.4.0",
    "ipython>=9.9.0",
    "feedparser>=6.0.12",
    "html2text>=2025.4.15",
    "pyyaml>=6.0.0",
    "pymupdf>=1.24.0",
    "google-cloud-storage>=3.9.0",
    "pillow>=12.2.0",
    "langchain-openai>=0.3.0",
    "python-dotenv>=1.1.0",
    "fastapi>=0.136.3",
    "uvicorn[standard]>=0.48.0",
    "pyzotero>=1.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "hypothesis>=6.100.0",
    # Preview-only: TRMNL renders the Liquid itself in production, so this is
    # never imported by the bot -- only by fitness.preview.
    "python-liquid>=2.0.0",
]

[dependency-groups]
dev = [
    "hypothesis>=6.150.0",
    "pytest-asyncio>=1.3.0",
]
