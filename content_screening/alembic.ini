[alembic]
script_location = %(here)s/migrations
prepend_sys_path = ..
version_path_separator = os

# Overridden in migrations/env.py so alembic and the app resolve the same
# file (see util.paths). Kept only as the offline/no-env default.
sqlalchemy.url = sqlite:///content_screening.db

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
