# OpenAlex signals. A paper is a candidate if ANY signal matches. Topics marked
# `require_keyword: true` only count when the work also matches a keyword above;
# author / citation / institution signals are never keyword-gated.
openalex:
  topics:
    - id: T11943
      name: Pharmacovigilance and Adverse Drug Reactions
    - id: T10508
      name: Patient Safety and Medication Errors
    - id: T13702
      name: Machine Learning in Healthcare
      require_keyword: true
    - id: T11396
      name: Artificial Intelligence in Healthcare
      require_keyword: true
  monitored_authors: []
  seed_papers: []
  # Citers of UMC's first/last-author works.
  institutions:
    - id: I111684115
      name: Uppsala Monitoring Centre
      author_positions: [first, last]
